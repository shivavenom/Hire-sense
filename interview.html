<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HireSense AI - Interview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="logo.jpeg" type="image/x-icon">
</head>

<body class="bg-gradient-to-br from-blue-100 via-white to-blue-200 min-h-screen flex flex-col">

<!-- Header -->
<div class="bg-blue-700 text-white px-8 py-5 flex justify-between items-center shadow-lg rounded-b-3xl">
    <span id="sessionId" class="font-medium text-sm tracking-wide"></span>

    <!-- Redirect to report.html -->
    <button id="endBtn"
        onclick="window.location.href='report.html'"
        class="bg-white text-blue-700 font-semibold px-6 py-2 rounded-full hover:bg-gray-100 transition active:scale-95 shadow-md">
        End Interview
    </button>
</div>

<!-- Main Layout -->
<div class="flex flex-1 overflow-hidden p-6 gap-6">

    <!-- Left Section -->
    <div class="flex-1 overflow-y-auto">

        <div class="bg-white shadow-2xl rounded-3xl p-10 h-full flex flex-col transition-all duration-300">

            <h2 id="questionTitle"
                class="text-2xl font-bold text-blue-700 mb-6">
                Interview Question
            </h2>

            <div id="questionBox"
                class="flex-1 bg-blue-50 rounded-3xl p-6 text-gray-700 leading-relaxed mb-6 overflow-y-auto shadow-inner">
            </div>

            <textarea id="answerBox"
                class="border border-blue-200 rounded-3xl p-5 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 mb-5 shadow-sm"
                rows="4"
                placeholder="Type your answer here..."></textarea>

            <button id="submitBtn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-full transition shadow-lg active:scale-95">
                Submit Answer
            </button>

        </div>

    </div>

    <!-- Right Section -->
    <div class="w-96 bg-white rounded-3xl shadow-2xl p-8 overflow-y-auto">

        <h3 class="text-lg font-bold text-blue-700 mb-5">
            Evaluation
        </h3>

        <div id="evaluationPanel"
            class="text-sm text-gray-700 space-y-4">
        </div>

    </div>

</div>

<script type="module" src="js/interview.js"></script>

</body>
</html>
